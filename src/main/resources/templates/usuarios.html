<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista de Usuarios - Amonic</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #004080; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
    </style>
</head>
<body>

    <h1>Usuarios Registrados en Amonic</h1>
    
    <a href="/usuarios/nuevo" style="display: inline-block; margin-bottom: 15px; padding: 10px 15px; background-color: #28a745; color: white; text-decoration: none; border-radius: 5px;">+ Nuevo Usuario</a>
    
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Email</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <!-- Aquí ocurre la magia de Thymeleaf -->
            <tr th:each="usuario : ${usuarios}">
                <td th:text="${usuario.id}"></td>
                <td th:text="${usuario.firstname}"></td>
                <td th:text="${usuario.lastname}"></td>
                <td th:text="${usuario.email}"></td>
                <td th:text="${usuario.active ? 'Activo' : 'Inactivo'}"></td>
                
               <td>
                    <a th:href="@{/usuarios/editar/{id}(id=${usuario.id})}" style="color: blue; text-decoration: none; font-weight: bold;">Editar</a>
                    |
                    <a th:href="@{/usuarios/eliminar/{id}(id=${usuario.id})}" style="color: red; text-decoration: none; font-weight: bold;">Borrar</a>
                </td>
                
            </tr>
        </tbody>
    </table>

</body>
</html>
