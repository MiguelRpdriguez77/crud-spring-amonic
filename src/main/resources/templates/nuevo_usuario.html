<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Usuario</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .form-container { max-width: 400px; margin: 0 auto; padding: 20px; border: 1px solid #ddd; border-radius: 5px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="email"] { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 15px; background-color: #004080; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Nuevo Usuario</h2>
        
        <!-- El formulario se enlaza al objeto 'usuario' que enviamos desde el controlador -->
        <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post">
            
                <input type="hidden" th:field="*{id}">
            
            <div class="form-group">
                <label>Nombre:</label>
                <!-- th:field enlaza este input directamente con la variable 'firstname' -->
                <input type="text" th:field="*{firstname}" required>
            </div>
            
            <div class="form-group">
                <label>Apellido:</label>
                <input type="text" th:field="*{lastname}" required>
            </div>
            
            <div class="form-group">
                <label>Email:</label>
                <input type="email" th:field="*{email}" required>
            </div>

            <button type="submit">Guardar Usuario</button>
            <a href="/usuarios" style="margin-left: 10px; text-decoration: none; color: #d9534f;">Cancelar</a>
        </form>
    </div>

</body>
</html>
